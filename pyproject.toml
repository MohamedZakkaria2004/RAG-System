[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-system"
version = "0.1.0"
description = "Production-style RAG system with ingestion, hybrid retrieval, reranking, citations, and RAGAS evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "chromadb>=0.5.0",
  "datasets>=4.0.0",
  "fastapi>=0.110.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "pypdf>=4.0.0",
  "pyyaml>=6.0.0",
  "ragas>=0.2.0",
  "rank-bm25>=0.2.2",
  "requests>=2.31.0",
  "sentence-transformers>=3.0.0",
  "tiktoken>=0.7.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.29.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
rag = "rag_system.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
